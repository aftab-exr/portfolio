name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes (Render free instances sleep after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render /api/health
        env:
          API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Error: RENDER_API_URL repository variable is not set."
            exit 1
          fi

          TARGET="${API_URL%/}/api/health"
          echo "Pinging $TARGET ..."
          curl --fail --silent --show-error --max-time 30 --retry 2 "$TARGET"
          echo ""
          echo "Health check succeeded."
